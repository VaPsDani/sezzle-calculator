services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Only used when the API is called directly from a browser. Through the
      # nginx proxy the frontend is same origin and CORS never applies.
      ALLOWED_ORIGIN: "http://localhost:3000"
    healthcheck:
      # wget comes from busybox, already in the Alpine base image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - calculator
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      # Waits for the healthcheck to pass, not merely for the container to
      # start, so nginx never proxies to a backend that is not listening yet.
      backend:
        condition: service_healthy
    networks:
      - calculator
    restart: unless-stopped

networks:
  calculator:
    driver: bridge
