server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No trailing slash on proxy_pass: the full path is forwarded as it came in,
    # so /api/v1/add reaches the backend as /api/v1/add. Adding a slash would
    # strip the /api/ prefix and every request would 404.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single page app has no file for /some/route, so anything that does not
    # match a real file falls back to index.html and React handles the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
